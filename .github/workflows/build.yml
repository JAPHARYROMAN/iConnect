name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-notice-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/tools -p test_native_notice_inventory.py -v
      - run: python -m unittest discover -s tests/tools -p test_android_ci_build.py -v
      - run: python -m unittest discover -s tests/tools -p test_android_batch_cancellation_baseline.py -v
      - run: python -m unittest discover -s tests/tools -p test_native_transport_patches.py -v
      - run: python -m unittest discover -s tests/tools -p test_android_instrumentation.py -v
  native-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build corrected native source bundle
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'iconnect-native-build'
          $bundle = Join-Path $env:RUNNER_TEMP 'iconnect-native-bundle'
          ./tools/prepare-native-transport.ps1 -BuildDirectory $build -Destination $bundle -Jobs 2 | ConvertTo-Json -Depth 4
          ./tools/assert-native-transport.ps1 -BundleDirectory $bundle | ConvertTo-Json -Depth 4
          ./tools/test-native-transport-selection.ps1 -BundleDirectory $bundle | ConvertTo-Json -Depth 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corrected-native-transport
          path: ${{ runner.temp }}/iconnect-native-bundle
          if-no-files-found: error
          retention-days: 7
  windows:
    needs: native-transport
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corrected-native-transport
          path: ${{ runner.temp }}/iconnect-native-bundle
      - name: Verify and select corrected native source bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'iconnect-native-bundle'
          ./tools/assert-native-transport.ps1 -BundleDirectory $bundle | ConvertTo-Json -Depth 4
          "ICONNECT_NATIVE_TRANSPORT_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: dotnet restore iConnect.slnx --locked-mode
      - run: dotnet build iConnect.slnx --no-restore --configuration Release
      - name: Windows main regression
        run: dotnet test tests/IConnect.Tests/IConnect.Tests.csproj --no-build --no-restore --configuration Release --filter "FullyQualifiedName!~Full_4096_item_file_plan&FullyQualifiedName!~Full4096ItemPrivateSnapshot&FullyQualifiedName!~Full4096ItemSender&FullyQualifiedName!~LargeFileTests" --logger "console;verbosity=minimal"
      - name: Windows receiver file capacity
        run: dotnet test tests/IConnect.Tests/IConnect.Tests.csproj --no-build --no-restore --configuration Release --filter "FullyQualifiedName~BatchPlanAdmissionTests.Full_4096_item_file_plan" --logger "console;verbosity=minimal"
      - name: Windows private snapshot capacity
        run: dotnet test tests/IConnect.Tests/IConnect.Tests.csproj --no-build --no-restore --configuration Release --filter "FullyQualifiedName~BatchSourceTests.Full4096ItemPrivateSnapshot" --logger "console;verbosity=minimal"
      - name: Windows private batch sender capacity
        run: dotnet test tests/IConnect.Tests/IConnect.Tests.csproj --no-build --no-restore --configuration Release --filter "FullyQualifiedName~BatchSenderTests.Full4096ItemSender" --logger "console;verbosity=minimal"
      - name: Windows isolated previews
        run: dotnet test tests/IConnect.Preview.Tests/IConnect.Preview.Tests.csproj --no-build --no-restore --configuration Release --logger "console;verbosity=minimal"
      - name: Verify unpackaged desktop publish assets
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'iconnect-desktop'
          dotnet publish apps/windows/IConnect.Desktop/IConnect.Desktop.csproj -c Release --no-build --no-restore -o $destination
          if ($LASTEXITCODE -ne 0) { throw 'Desktop publish failed.' }
          foreach ($relative in @('App.xbf', 'MainWindow.xbf', 'IConnect.Desktop.pri', 'libDatachannel/datachannel.dll', 'PreviewWorker/IConnect.Preview.Worker.exe', 'PreviewWorker/coreclr.dll', 'PreviewWorker/WinRT.Runtime.dll', 'AttachmentWorker/IConnect.Attachment.Worker.exe', 'AttachmentWorker/coreclr.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $destination $relative) -PathType Leaf)) { throw "Missing published asset: $relative" }
          }
          ./tools/write-windows-release-sbom.ps1 -Payload $destination -ConnectivityAssets apps/windows/IConnect.Connectivity/obj/project.assets.json -PackageName iConnect.CiPublishFixture -Version 0.2.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify explicit native bundle packaging and guards
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'iconnect-native-bundle'
          $missing = Join-Path $env:RUNNER_TEMP 'missing-native-bundle'
          $previous = $env:ICONNECT_NATIVE_TRANSPORT_BUNDLE
          try {
            $env:ICONNECT_NATIVE_TRANSPORT_BUNDLE = $missing
            $package = ./tools/package-windows.ps1 -PackageName iConnect.CiExplicitBundleFixture -Version 1.0.0.0 -Publisher 'CN=iConnect CI Fixture' -Unsigned -NoRestore -NativeTransportBundle $bundle
            if ($env:ICONNECT_NATIVE_TRANSPORT_BUNDLE -cne $missing) { throw 'Packaging did not restore its caller environment.' }
          } finally { $env:ICONNECT_NATIVE_TRANSPORT_BUNDLE = $previous }
          ./tools/test-native-package.ps1 -Package $package.Path -Payload (Join-Path $package.WorkDirectory 'payload') -ExerciseGuards -RequireNoticeInventory | ConvertTo-Json -Depth 4
  windows-large-files:
    needs: native-transport
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corrected-native-transport
          path: ${{ runner.temp }}/iconnect-native-bundle
      - name: Verify and select corrected native source bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'iconnect-native-bundle'
          ./tools/assert-native-transport.ps1 -BundleDirectory $bundle | ConvertTo-Json -Depth 4
          "ICONNECT_NATIVE_TRANSPORT_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: dotnet restore tests/IConnect.Tests/IConnect.Tests.csproj --locked-mode
      - run: dotnet build tests/IConnect.Tests/IConnect.Tests.csproj --no-restore --configuration Release
      - name: Windows large-file transfers and restart
        run: dotnet test tests/IConnect.Tests/IConnect.Tests.csproj --no-build --no-restore --configuration Release --filter "FullyQualifiedName~LargeFileTests" --logger "console;verbosity=minimal"
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: python ../../tools/build_android_ci.py
